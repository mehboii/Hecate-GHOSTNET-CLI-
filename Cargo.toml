[package]
name = "ghostnet"
version = "0.2.12"
edition = "2021"
description = "GhostNet CLI — encrypted mesh network client by the N11X Collective"
license = "MIT"
authors = ["N11X Collective"]
repository = "https://github.com/mehboii/GHOSTNET-CLI"
readme = "README.md"

[[bin]]
name = "ghostnet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
