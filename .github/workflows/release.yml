name: release

on:
  push:
    tags:
      - 'v*'

# Default to read-only; only the publish job is granted write.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ghostnet-win32-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ghostnet-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: ghostnet-linux-arm64
            linker: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ghostnet-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ghostnet-darwin-arm64
    steps:
      # Actions are pinned to commit SHAs (not mutable tags) to prevent a moved
      # tag or compromised action from tampering with the released binaries.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/hecate" "${{ matrix.asset }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: copy "target\${{ matrix.target }}\release\hecate.exe" "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required only to create the release / upload assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum ghostnet-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release with all binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/ghostnet-*
            artifacts/SHA256SUMS.txt
